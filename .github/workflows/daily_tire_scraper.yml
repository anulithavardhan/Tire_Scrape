name: Daily Tire Scraper

on:
  schedule:
    - cron: '0 8 * * *'   # runs every day at 8:00 AM UTC — adjust as needed
  workflow_dispatch:        # allows manual trigger from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # kill if it hangs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install playwright nest_asyncio pandas aiohttp beautifulsoup4 lxml

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        run: python scraper/combined_tire_scraper.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: tire-prices-${{ github.run_id }}
          path: scraper/tire_prices_*.csv
          retention-days: 90
