name: SimpleTire Scraper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run all SimpleTire products
        run: node scraper/simpletire-scrape.js --default-gt-radial --format csv > simpletire_raw.csv

      - name: Upload SimpleTire CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simpletire-results-${{ github.run_id }}
          path: simpletire_raw.csv
          if-no-files-found: error
          retention-days: 30
