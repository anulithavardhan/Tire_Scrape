name: Daily Tire Scraper

on:
  schedule:
    - cron: '0 8 * * *'   # runs every day at 8:00 AM UTC
  workflow_dispatch:        # allows manual trigger from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install playwright nest_asyncio pandas aiohttp beautifulsoup4 lxml

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        run: python scraper/combined_tire_scraper_actions.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: tire-prices-${{ github.run_id }}
          path: tire_prices_*.csv
          retention-days: 90
