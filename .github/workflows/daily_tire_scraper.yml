name: Tire Price Scraper

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 10:00 UTC (6:00 AM EDT / 5:00 AM EST).
    - cron: "0 10 * * *"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Scrape Giga and Priority
        run: python scraper/combined_tire_scraper_actions.py

      - name: Standardize and join MAP prices
        run: python scraper/standardize_tire_prices.py

      - name: Upload standardized CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tire-prices-${{ github.run_id }}
          path: tire_prices_*.csv
          if-no-files-found: error
          retention-days: 30
